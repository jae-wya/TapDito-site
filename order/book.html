<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserve a table</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Geist:wght@400;500;600&display=swap">
<style>
:root { --bg:#FAF7F2; --card:#FFFFFF; --line:#EDE2D5; --ink:#1B1612; --ink2:#6E6257; --accent:#EE9420; --on-accent:#1B1612; --ok:#2E7D4F; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 520px; margin: 0 auto; padding: 22px 20px 40px; }
h1 { font: 800 24px/1.15 "Montserrat", sans-serif; margin: 0 0 4px; }
.sub { color: var(--ink2); margin: 0 0 18px; }
label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
input, select, textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 13px 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pax { display: flex; align-items: center; gap: 8px; }
.pax button { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 22px; cursor: pointer; }
.pax output { min-width: 56px; text-align: center; font: 800 22px/1 "Montserrat", sans-serif; }
.primary { width: 100%; min-height: 56px; margin-top: 22px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; cursor: pointer; }
.primary:disabled { opacity: .5; }
.fine { color: var(--ink2); font-size: 12.5px; margin: 14px 0 0; }
.err { color: #B3261E; font-size: 14px; margin-top: 10px; }
.done { text-align: center; padding: 50px 10px; }
.tick { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 38px; }
.done h2 { font: 800 24px/1.2 "Montserrat", sans-serif; margin: 0 0 8px; }
.done p { color: var(--ink2); margin: 0 0 8px; }
.mode { text-align: center; color: var(--ink2); font-size: 12px; padding-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <form id="f" novalidate>
    <h1 id="title">Reserve a table</h1>
    <p class="sub">We’ll confirm your booking by call or text.</p>
    <label for="name">Name</label><input id="name" autocomplete="name" maxlength="60" required>
    <label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09XX XXX XXXX" maxlength="16" required>
    <div class="two">
      <div><label for="date">Date</label><input id="date" type="date" required></div>
      <div><label for="time">Time</label><select id="time" required></select></div>
    </div>
    <label>Number of guests</label>
    <div class="pax"><button type="button" id="minus" aria-label="Fewer guests">−</button><output id="pax">2</output><button type="button" id="plus" aria-label="More guests">+</button></div>
    <label for="note">Note (optional)</label><textarea id="note" rows="2" maxlength="200" placeholder="Birthday, private room, high chair…"></textarea>
    <button class="primary" id="go" type="submit">Request booking</button>
    <p class="err" id="err" hidden></p>
    <p class="fine">Privacy: we use your name and number only to manage this booking, as required by the Data Privacy Act of 2012. We don’t share them with anyone else.</p>
  </form>
  <div id="ok" hidden></div>
  <p class="mode" id="mode"></p>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
(async function () {
  const TD = window.TD, $ = (s) => document.querySelector(s), esc = TD.esc;
  $("#mode").textContent = TD.live ? "" : "Demo mode: bookings stay on this device.";
  try { const m = await TD.menu(); TD.theme(m.theme); $("#title").textContent = "Reserve a table at " + (m.name || "us"); document.title = "Reserve · " + (m.name || ""); } catch (e) {}
  const pad = (n) => String(n).padStart(2, "0");
  const today = new Date(); const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const max = new Date(); max.setDate(max.getDate() + 60);
  $("#date").min = iso(today); $("#date").max = iso(max); $("#date").value = iso(today);
  const slots = []; for (let h = 10; h <= 21; h++) for (const m of [0, 30]) { if (h === 21 && m === 30) continue; slots.push(pad(h) + ":" + pad(m)); }
  const label = (t) => { const [h, m] = t.split(":").map(Number); return ((h + 11) % 12 + 1) + ":" + pad(m) + (h < 12 ? " AM" : " PM"); };
  function fillTimes() {
    const now = new Date(), isToday = $("#date").value === iso(now);
    const cut = now.getHours() * 60 + now.getMinutes() + 60;
    const ok = slots.filter(t => { const [h, m] = t.split(":").map(Number); return !isToday || h * 60 + m >= cut; });
    $("#time").innerHTML = ok.length ? ok.map(t => `<option value="${t}">${label(t)}</option>`).join("") : '<option value="">No more slots today</option>';
    if (ok.includes("19:00")) $("#time").value = "19:00";
  }
  $("#date").onchange = fillTimes; fillTimes();
  let pax = 2;
  $("#minus").onclick = () => { pax = Math.max(1, pax - 1); $("#pax").textContent = pax; };
  $("#plus").onclick = () => { pax = Math.min(40, pax + 1); $("#pax").textContent = pax; };
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("#name").value.trim(), phone = $("#phone").value.replace(/[^\d+]/g, ""), date = $("#date").value, time = $("#time").value;
    const er = $("#err"); er.hidden = true;
    if (!name || phone.length < 10 || !date || !time) { er.hidden = false; er.textContent = "Please fill in your name, a valid mobile number, date and time."; return; }
    $("#go").disabled = true; $("#go").textContent = "Sending…";
    try {
      await TD.addBooking({ name, phone, date, time, pax, note: $("#note").value.trim() });
      $("#f").hidden = true; $("#ok").hidden = false;
      const d = new Date(date + "T00:00").toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" });
      $("#ok").innerHTML = `<div class="done"><div class="tick">✓</div><h2>Booking requested</h2><p>${esc(d)}, ${label(time)} · ${pax} guest${pax > 1 ? "s" : ""}</p><p>We’ll call or text ${esc(phone)} to confirm. Salamat po!</p></div>`;
    } catch (x) { $("#go").disabled = false; $("#go").textContent = "Request booking"; er.hidden = false; er.textContent = "Couldn't send. Please try again or call us."; }
  };
})();
</script>
</body>
</html>
